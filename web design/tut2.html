<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      *{
        margin: 0;
        padding: 0;
        
      }
      .parent{
        border: 3px solid red;
      }
        .boxa {
        width: 1000px;
        height: 100px;
        border: 3px solid black;
        margin: 10px;
        padding: 15px;
      }
      .box1 {
        background-color: aqua;
        position: absolute;
        top: 3px;
      }

      .box2 {
        background-color: azure;
        position: relative;
        top: 34px;
        left: 20px;
      }

      .box3 {
        background-color: antiquewhite;
        position: relative;
        left: 3.5vw;
        top: -76px;
      }

      .box4 {
        background-color: purple;
        position: relative;
        top: -184px;
        left: 5.5vw;
      }
    </style>
</head>
<body>
    <div class="parent">
        <div class="boxa box1"></div>
        <div class="boxa box2"></div>
        <div class="boxa box3"></div>
        <div class="boxa box4"></div>
</html>
